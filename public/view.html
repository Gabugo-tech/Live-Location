<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Viewing a live shared location in real time." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4CD;</text></svg>" />
  <title>Live Location Viewer</title>

  <!-- Preconnect to speed up tile + CDN loading -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
  <link rel="dns-prefetch" href="https://a.tile.openstreetmap.org" />
  <link rel="dns-prefetch" href="https://b.tile.openstreetmap.org" />
  <link rel="dns-prefetch" href="https://c.tile.openstreetmap.org" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      animation: blink 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    .dot.waiting    { background: #f59e0b; animation: none; }
    .dot.stopped    { background: #f87171; animation: none; }
    .dot.last-known { background: #f59e0b; animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    #topbar-status  { font-size: 0.9rem; color: rgba(255,255,255,0.75); }
    #coords-display { font-size: 0.78rem; color: rgba(255,255,255,0.4); font-family: monospace; }

    #map { flex: 1; width: 100%; }

    .info-panel {
      background: rgba(255,255,255,0.05);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 12px 20px;
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .info-item { display: flex; flex-direction: column; gap: 2px; }

    .info-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.35);
    }

    .info-value {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.85);
      font-family: monospace;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(15,23,42,0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 20px;
    }

    #overlay.hidden { display: none; }

    .overlay-icon  { font-size: 52px; }
    .overlay-title { font-size: 1.4rem; font-weight: 700; }
    .overlay-sub   { color: rgba(255,255,255,0.5); font-size: 0.9rem; }

    #last-known-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: rgba(248,113,113,0.12);
      border-bottom: 1px solid rgba(248,113,113,0.3);
      font-size: 0.82rem;
      color: #fca5a5;
      flex-shrink: 0;
      z-index: 1000;
    }

    #last-known-banner.visible      { display: flex; }
    #last-known-banner .banner-icon { font-size: 14px; }
    #last-known-banner .banner-time { margin-left: auto; font-family: monospace; color: rgba(255,255,255,0.4); font-size: 0.75rem; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <div class="dot waiting" id="status-dot"></div>
      <span id="topbar-status">Waiting for sharer to connect...</span>
    </div>
    <span id="coords-display">&mdash;</span>
  </div>

  <div id="last-known-banner">
    <span class="banner-icon">&#x1F534;</span>
    <span>Sharing stopped &mdash; showing last known location</span>
    <span class="banner-time" id="banner-time"></span>
  </div>

  <div id="map"></div>

  <div class="info-panel">
    <div class="info-item">
      <span class="info-label">Latitude</span>
      <span class="info-value" id="info-lat">&mdash;</span>
    </div>
    <div class="info-item">
      <span class="info-label">Longitude</span>
      <span class="info-value" id="info-lng">&mdash;</span>
    </div>
    <div class="info-item">
      <span class="info-label">Accuracy</span>
      <span class="info-value" id="info-acc">&mdash;</span>
    </div>
    <div class="info-item">
      <span class="info-label">Last Update</span>
      <span class="info-value" id="info-time">&mdash;</span>
    </div>
  </div>

  <div id="overlay">
    <div class="overlay-icon">&#x23F3;</div>
    <div class="overlay-title">Waiting for location...</div>
    <div class="overlay-sub">The sharer hasn't sent their location yet.<br>This page will update automatically.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const params    = new URLSearchParams(window.location.search);
    const sessionId = params.get('id');

    if (!sessionId) window.location.href = '/';

    const map = L.map('map', { zoomControl: true }).setView([0, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
      keepBuffer: 4,        // pre-fetch more surrounding tiles
      updateWhenIdle: false, // update tiles while panning, not just after
      updateWhenZooming: false
    }).addTo(map);

    const markerIcon = L.divIcon({
      className: '',
      html: '<div style="width:18px;height:18px;background:#e94560;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.5);"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    let marker         = null;
    let accuracyCircle = null;
    let firstFix       = true;

    const overlay       = document.getElementById('overlay');
    const bannerEl      = document.getElementById('last-known-banner');
    const bannerTime    = document.getElementById('banner-time');
    const statusDot     = document.getElementById('status-dot');
    const statusText    = document.getElementById('topbar-status');
    const coordsDisplay = document.getElementById('coords-display');
    const infoLat       = document.getElementById('info-lat');
    const infoLng       = document.getElementById('info-lng');
    const infoAcc       = document.getElementById('info-acc');
    const infoTime      = document.getElementById('info-time');

    function formatTime(timestamp, tz) {
      try {
        return new Date(timestamp).toLocaleTimeString(undefined, tz ? { timeZone: tz } : {});
      } catch {
        return new Date(timestamp).toLocaleTimeString();
      }
    }

    function updateUI(lat, lng, accuracy, timestamp, isLastKnown, tz) {
      isLastKnown = isLastKnown || false;
      tz = tz || null;

      overlay.classList.add('hidden');

      if (isLastKnown) {
        bannerEl.classList.add('visible');
        bannerTime.textContent = 'Last seen ' + formatTime(timestamp, tz);
        statusDot.className    = 'dot last-known';
        statusText.textContent = 'Last known location';
      } else {
        bannerEl.classList.remove('visible');
        statusDot.className    = 'dot';
        statusText.textContent = 'Live \u2014 location updating';
      }

      coordsDisplay.textContent = lat.toFixed(5) + ', ' + lng.toFixed(5);
      infoLat.textContent  = lat.toFixed(6);
      infoLng.textContent  = lng.toFixed(6);
      infoAcc.textContent  = accuracy ? '\u00B1' + Math.round(accuracy) + ' m' : '\u2014';
      infoTime.textContent = formatTime(timestamp, tz);

      const latlng = [lat, lng];
      if (!marker) {
        marker = L.marker(latlng, { icon: markerIcon }).addTo(map);
      } else {
        marker.setLatLng(latlng);
      }

      if (accuracy) {
        if (accuracyCircle) {
          accuracyCircle.setLatLng(latlng).setRadius(accuracy);
        } else {
          accuracyCircle = L.circle(latlng, {
            radius: accuracy,
            color: '#e94560',
            fillColor: '#e94560',
            fillOpacity: 0.12,
            weight: 1
          }).addTo(map);
        }
      }

      if (firstFix) {
        map.flyTo(latlng, 16, { duration: 0.8 });
        firstFix = false;
      } else if (!isLastKnown) {
        map.panTo(latlng, { animate: true, duration: 0.8 });
      }
    }

    const socket = io({ transports: ['websocket'] });
    socket.emit('join-view', sessionId);

    socket.on('location-update', function(d) {
      updateUI(d.lat, d.lng, d.accuracy, d.timestamp, false, d.tz || null);
    });

    socket.on('waiting', function() {
      overlay.classList.remove('hidden');
      bannerEl.classList.remove('visible');
      statusDot.className    = 'dot waiting';
      statusText.textContent = 'Waiting for sharer to connect...';
    });

    socket.on('sharing-stopped', function(data) {
      if (data && data.lat != null) {
        updateUI(data.lat, data.lng, data.accuracy, data.timestamp, true, data.tz || null);
      } else {
        bannerEl.classList.add('visible');
        bannerTime.textContent = '';
        statusDot.className    = 'dot stopped';
        statusText.textContent = 'Sharing stopped';
      }
    });
  </script>
</body>
</html>
