<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Viewing a live shared location in real time." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>" />
  <title>Live Location Viewer</title>

  <!-- Preconnect to speed up tile + CDN loading -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
  <link rel="dns-prefetch" href="https://a.tile.openstreetmap.org" />
  <link rel="dns-prefetch" href="https://b.tile.openstreetmap.org" />
  <link rel="dns-prefetch" href="https://c.tile.openstreetmap.org" />

  <!-- Leaflet CSS — jsdelivr is faster than unpkg globally -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      animation: blink 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    .dot.waiting { background: #f59e0b; animation: none; }
    .dot.stopped { background: #f87171; animation: none; }
    .dot.last-known { background: #f59e0b; animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    #topbar-status {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.75);
    }

    #coords-display {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      font-family: monospace;
    }

    /* ── Map ── */
    #map {
      flex: 1;
      width: 100%;
    }

    /* ── Info panel ── */
    .info-panel {
      background: rgba(255,255,255,0.05);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 12px 20px;
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.35);
    }

    .info-value {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.85);
      font-family: monospace;
    }

    /* ── Overlay for waiting state only ── */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(15,23,42,0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 20px;
    }

    #overlay.hidden { display: none; }

    .overlay-icon { font-size: 52px; }
    .overlay-title { font-size: 1.4rem; font-weight: 700; }
    .overlay-sub   { color: rgba(255,255,255,0.5); font-size: 0.9rem; }

    /* ── Last-known banner (replaces full overlay when sharing stops) ── */
    #last-known-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: rgba(248,113,113,0.12);
      border-bottom: 1px solid rgba(248,113,113,0.3);
      font-size: 0.82rem;
      color: #fca5a5;
      flex-shrink: 0;
      z-index: 1000;
    }

    #last-known-banner.visible { display: flex; }
    #last-known-banner .banner-icon { font-size: 14px; }
    #last-known-banner .banner-time { margin-left: auto; font-family: monospace; color: rgba(255,255,255,0.4); font-size: 0.75rem; }
  </style>
</head>
<body>

  <!-- Top status bar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="dot waiting" id="status-dot"></div>
      <span id="topbar-status">Waiting for sharer to connect...</span>
    </div>
    <span id="coords-display">—</span>
  </div>

  <!-- Last-known location banner -->
  <div id="last-known-banner">
    <span class="banner-icon">🔴</span>
    <span>Sharing stopped — showing last known location</span>
    <span class="banner-time" id="banner-time"></span>
  </div>

  <!-- Map -->
  <div id="map"></div>
  <div class="info-panel">
    <div class="info-item">
      <span class="info-label">Latitude</span>
      <span class="info-value" id="info-lat">—</span>
    </div>
    <div class="info-item">
      <span class="info-label">Longitude</span>
      <span class="info-value" id="info-lng">—</span>
    </div>
    <div class="info-item">
      <span class="info-label">Accuracy</span>
      <span class="info-value" id="info-acc">—</span>
    </div>
    <div class="info-item">
      <span class="info-label">Last Update</span>
      <span class="info-value" id="info-time">—</span>
    </div>
  </div>

  <!-- Waiting / stopped overlay -->
  <div id="overlay">
    <div class="overlay-icon">⏳</div>
    <div class="overlay-title">Waiting for location...</div>
    <div class="overlay-sub">The sharer hasn't sent their location yet.<br>This page will update automatically.</div>
  </div>

  <!-- Leaflet JS — jsdelivr -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/view.js"></script>
</body>
</html>
