<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Sharing your live location in real time." />
  <meta name="theme-color" content="#0f3460" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Sharing My Location</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .pulse-icon {
      font-size: 52px;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    h1 { font-size: 1.7rem; font-weight: 700; margin-bottom: 8px; }
    #status {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-bottom: 16px;
      min-height: 20px;
    }
    .status-active { color: #4ade80 !important; }
    .status-error  { color: #f87171 !important; }
    .signout-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }
    .signout-btn-sm {
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.4);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 20px;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .signout-btn-sm:hover { color: #f87171; border-color: rgba(248,113,113,0.4); }
    .decoy-section {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: left;
    }
    .decoy-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .decoy-label span { font-size: 14px; }
    .decoy-row { display: flex; align-items: center; gap: 10px; }
    .country-picker { position: relative; flex: 1; }
    .country-input-wrap {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 0 10px;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .country-input-wrap:focus-within { border-color: rgba(255,255,255,0.4); }
    .country-input-wrap input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      padding: 9px 4px;
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
      min-width: 0;
    }
    .country-input-wrap input::placeholder { color: rgba(255,255,255,0.45); }
    .picker-arrow {
      color: rgba(255,255,255,0.4);
      font-size: 0.7rem;
      flex-shrink: 0;
      transition: transform 0.2s;
      pointer-events: none;
    }
    .picker-arrow.open { transform: rotate(180deg); }
    .country-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: #1e2a45;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 999;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .country-dropdown.open { display: block; }
    .country-dropdown::-webkit-scrollbar { width: 5px; }
    .country-dropdown::-webkit-scrollbar-track { background: transparent; }
    .country-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    .dd-group-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.3);
      padding: 8px 12px 4px;
      pointer-events: none;
    }
    .dd-option {
      padding: 9px 14px;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dd-option:hover { background: rgba(255,255,255,0.08); }
    .dd-option.selected { background: rgba(233,69,96,0.2); color: #fff; }
    .dd-option.no-results {
      color: rgba(255,255,255,0.35);
      font-style: italic;
      cursor: default;
      pointer-events: none;
    }
    .decoy-badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 50px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-real    { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid #4ade8044; }
    .badge-spoofed { background: rgba(233,69,96,0.15);  color: #e94560; border: 1px solid #e9456044; }
    .link-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    #share-link {
      flex: 1;
      background: none;
      border: none;
      color: #93c5fd;
      font-size: 0.85rem;
      outline: none;
      word-break: break-all;
      cursor: text;
    }
    .copy-btn {
      background: #e94560;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .copy-btn:hover { background: #c23152; }
    .coords {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 24px;
      min-height: 18px;
      font-family: monospace;
    }
    .stop-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #f87171;
      padding: 12px 28px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s, opacity 0.2s;
    }
    .stop-btn:hover { background: rgba(248,113,113,0.15); }
    .stop-btn:disabled { opacity: 0.35; cursor: not-allowed; color: rgba(255,255,255,0.4); }
    .resume-btn {
      background: linear-gradient(135deg, #4ade80, #16a34a);
      border: none;
      color: #fff;
      padding: 12px 28px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 4px 16px rgba(74,222,128,0.3);
      display: none;
    }
    .resume-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .stopped-banner {
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.88rem;
      color: #f87171;
      margin-bottom: 16px;
      display: none;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #4ade80;
      color: #14532d;
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: transform 0.3s ease;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <div class="pulse-icon" id="pulse-icon">&#x1F4E1;</div>
    <h1>Sharing Your Location</h1>
    <div id="status">Choose a spoof country or share your real location below.</div>

    <div class="signout-bar">
      <button class="signout-btn-sm" onclick="signOut()">Sign out</button>
    </div>

    <div class="decoy-section">
      <div class="decoy-label">
        <span>&#x1F3AD;</span> Location Spoof &mdash; viewers will see this country instead
      </div>
      <div class="decoy-row">
        <div class="country-picker" id="country-picker">
          <div class="country-input-wrap" id="picker-trigger">
            <input type="text" id="country-search" placeholder="No spoof &mdash; share real location" autocomplete="off" />
            <span class="picker-arrow" id="picker-arrow">&#x25BC;</span>
          </div>
          <div class="country-dropdown" id="country-dropdown"></div>
        </div>
        <span class="decoy-badge badge-real" id="spoof-badge">REAL</span>
      </div>
    </div>

    <div class="link-box">
      <input id="share-link" type="text" readonly />
      <button class="copy-btn" onclick="copyLink()">Copy</button>
    </div>

    <div class="coords" id="coords">Waiting for GPS fix...</div>

    <div class="stopped-banner" id="stopped-banner">&#x1F534; You have stopped sharing. Viewers have been notified.</div>

    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
      <button class="stop-btn" id="stop-btn" onclick="stopSharing()">Stop Sharing</button>
      <button class="resume-btn" id="resume-btn" onclick="resumeSharing()">&#x25B6; Resume Sharing</button>
    </div>
  </div>

  <div class="toast" id="toast">Link copied!</div>

      { value: 'UZ', label: '\uD83C\uDDFA\uD83C\uDDFF Uzbekistan (Tashkent)',       group: '\uD83C\uDF0F Asia' },
      { value: 'AF', label: '\uD83C\uDDE6\uD83C\uDDEB Afghanistan (Kabul)',         group: '\uD83C\uDF0F Asia' },
      { value: 'TW', label: '\uD83C\uDDF9\uD83C\uDDFC Taiwan (Taipei)',             group: '\uD83C\uDF0F Asia' },
      { value: 'HK', label: '\uD83C\uDDED\uD83C\uDDF0 Hong Kong',                  group: '\uD83C\uDF0F Asia' },
      { value: 'AU', label: '\uD83C\uDDE6\uD83C\uDDFA Australia (Sydney)',          group: '\uD83C\uDF0F Oceania' },
      { value: 'NZ', label: '\uD83C\uDDF3\uD83C\uDDFF New Zealand (Auckland)',      group: '\uD83C\uDF0F Oceania' },
      { value: 'FJ', label: '\uD83C\uDDEB\uD83C\uDDEF Fiji (Suva)',                 group: '\uD83C\uDF0F Oceania' },
    ];

    const params    = new URLSearchParams(window.location.search);
    const sessionId = params.get('id');
    if (!sessionId) window.location.href = '/';

    const viewerUrl = window.location.origin + '/view.html?id=' + sessionId;
    document.getElementById('share-link').value = viewerUrl;

    const socket = io({ transports: ['websocket'] });
    socket.emit('join-share', sessionId);

    const statusEl      = document.getElementById('status');
    const coordsEl      = document.getElementById('coords');
    const badgeEl       = document.getElementById('spoof-badge');
    const stopBtn       = document.getElementById('stop-btn');
    const resumeBtn     = document.getElementById('resume-btn');
    const stoppedBanner = document.getElementById('stopped-banner');
    const pulseIcon     = document.getElementById('pulse-icon');

    let selectedValue = 'none';
    let selectedLabel = 'No spoof \u2014 share real location';

    const searchInput   = document.getElementById('country-search');
    const dropdown      = document.getElementById('country-dropdown');
    const pickerArrow   = document.getElementById('picker-arrow');
    const pickerTrigger = document.getElementById('picker-trigger');

    function renderDropdown(query) {
      const q = query.toLowerCase().trim();
      dropdown.innerHTML = '';
      let lastGroup = null, count = 0;
      COUNTRY_LIST.forEach(function(item) {
        if (!item.label.toLowerCase().includes(q)) return;
        if (item.group && item.group !== lastGroup && !q) {
          const hdr = document.createElement('div');
          hdr.className = 'dd-group-label';
          hdr.textContent = item.group;
          dropdown.appendChild(hdr);
          lastGroup = item.group;
        }
        const opt = document.createElement('div');
        opt.className = 'dd-option' + (item.value === selectedValue ? ' selected' : '');
        opt.textContent = item.label;
        opt.dataset.value = item.value;
        opt.addEventListener('mousedown', function(e) {
          e.preventDefault();
          selectCountry(item.value, item.label);
        });
        dropdown.appendChild(opt);
        count++;
      });
      if (count === 0) {
        const none = document.createElement('div');
        none.className = 'dd-option no-results';
        none.textContent = 'No countries found';
        dropdown.appendChild(none);
      }
    }

    function openDropdown() {
      renderDropdown('');
      dropdown.classList.add('open');
      pickerArrow.classList.add('open');
      searchInput.select();
    }

    function closeDropdown() {
      dropdown.classList.remove('open');
      pickerArrow.classList.remove('open');
      searchInput.value = selectedValue === 'none' ? '' : selectedLabel;
      searchInput.placeholder = selectedValue === 'none' ? 'No spoof \u2014 share real location' : selectedLabel;
    }

    function selectCountry(value, label) {
      selectedValue = value;
      selectedLabel = label;
      searchInput.value = value === 'none' ? '' : label;
      searchInput.placeholder = value === 'none' ? 'No spoof \u2014 share real location' : label;
      dropdown.classList.remove('open');
      pickerArrow.classList.remove('open');
      badgeEl.textContent = value === 'none' ? 'REAL' : 'SPOOFED';
      badgeEl.className   = value === 'none' ? 'decoy-badge badge-real' : 'decoy-badge badge-spoofed';
      driftLat = 0; driftLng = 0;
      stopCurrentMode();
      startSharing();
    }

    pickerTrigger.addEventListener('click', function() {
      if (dropdown.classList.contains('open')) { closeDropdown(); } else { searchInput.value = ''; openDropdown(); }
    });
    searchInput.addEventListener('input', function() {
      renderDropdown(searchInput.value);
      if (!dropdown.classList.contains('open')) { dropdown.classList.add('open'); pickerArrow.classList.add('open'); }
    });
    searchInput.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDropdown(); });
    document.addEventListener('mousedown', function(e) {
      if (!document.getElementById('country-picker').contains(e.target)) closeDropdown();
    });

    function getSelectedCountry() { return selectedValue; }

    let watchId = null, spoofInterval = null, driftLat = 0, driftLng = 0;

    function stopCurrentMode() {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      if (spoofInterval !== null) { clearInterval(spoofInterval); spoofInterval = null; }
    }

    function startSpoofMode(country) {
      const anchor = DECOY_ANCHORS[country];
      statusEl.textContent = '\uD83C\uDFAD Live \u2014 spoofed location is being shared';
      statusEl.className   = 'status-active';
      coordsEl.textContent = 'Streaming from: ' + anchor.lat.toFixed(4) + ', ' + anchor.lng.toFixed(4);
      function sendSpoofed() {
        driftLat += (Math.random() - 0.5) * 0.00005;
        driftLng += (Math.random() - 0.5) * 0.00005;
        driftLat = Math.max(-0.0005, Math.min(0.0005, driftLat));
        driftLng = Math.max(-0.0005, Math.min(0.0005, driftLng));
        socket.emit('send-location', { sessionId: sessionId, lat: anchor.lat + driftLat, lng: anchor.lng + driftLng, accuracy: 10, tz: anchor.tz });
      }
      sendSpoofed();
      spoofInterval = setInterval(sendSpoofed, 2000);
    }

    function startRealMode() {
      if (!navigator.geolocation) {
        statusEl.textContent = 'Geolocation is not supported by your browser.';
        statusEl.className = 'status-error';
        return;
      }
      statusEl.textContent = 'Requesting location access...';
      statusEl.className = '';
      coordsEl.textContent = 'Waiting for GPS fix...';
      watchId = navigator.geolocation.watchPosition(
        function(pos) {
          const lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy;
          socket.emit('send-location', { sessionId: sessionId, lat: lat, lng: lng, accuracy: acc });
          statusEl.textContent = '\uD83D\uDCE1 Live \u2014 real location is being shared';
          statusEl.className   = 'status-active';
          coordsEl.textContent = 'Your position: ' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '  \u00B1' + Math.round(acc) + 'm';
        },
        function(err) {
          statusEl.textContent = 'Location error: ' + err.message;
          statusEl.className = 'status-error';
          coordsEl.textContent = '';
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
      );
    }

    function startSharing() {
      const country = getSelectedCountry();
      if (country !== 'none') { startSpoofMode(country); } else { startRealMode(); }
    }

    function stopSharing() {
      stopCurrentMode();
      socket.emit('stop-sharing', sessionId);
      statusEl.textContent = 'You have stopped sharing.';
      statusEl.className   = '';
      coordsEl.textContent = '';
      stoppedBanner.style.display = 'block';
      stopBtn.disabled    = true;
      stopBtn.textContent = 'Sharing Stopped';
      resumeBtn.style.display = 'inline-block';
      pulseIcon.style.animation = 'none';
      pulseIcon.textContent = '\uD83D\uDD34';
    }

    function resumeSharing() {
      stoppedBanner.style.display = 'none';
      stopBtn.disabled    = false;
      stopBtn.textContent = 'Stop Sharing';
      resumeBtn.style.display = 'none';
      pulseIcon.style.animation = 'pulse 1.5s ease-in-out infinite';
      pulseIcon.textContent = '\uD83D\uDCE1';
      socket.emit('join-share', sessionId);
      driftLat = 0; driftLng = 0;
      startSharing();
    }

    function copyLink() {
      navigator.clipboard.writeText(viewerUrl).then(function() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 2200);
      });
    }

    const adminToken = sessionStorage.getItem('adminToken');
    if (!adminToken) window.location.href = '/';

    (async function() {
      try {
        const res = await fetch('/validate-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: adminToken })
        });
        if (!res.ok) { sessionStorage.removeItem('adminToken'); window.location.href = '/'; }
      } catch(e) { /* allow local session to continue on network error */ }
    })();

    function signOut() {
      fetch('/logout-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: adminToken })
      });
      sessionStorage.removeItem('adminToken');
      stopCurrentMode();
      window.location.href = '/';
    }

    startSharing();
  </script>
