<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharing My Location</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .pulse-icon {
      font-size: 52px;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 { font-size: 1.7rem; font-weight: 700; margin-bottom: 8px; }

    #status {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-bottom: 16px;
      min-height: 20px;
    }

    .status-active { color: #4ade80 !important; }
    .status-error  { color: #f87171 !important; }

    /* ── Decoy selector ── */
    .decoy-section {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .decoy-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .decoy-label span { font-size: 14px; }

    .decoy-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Searchable country picker ── */
    .country-picker {
      position: relative;
      flex: 1;
    }

    .country-input-wrap {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 0 10px;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .country-input-wrap:focus-within {
      border-color: rgba(255,255,255,0.4);
    }

    .country-input-wrap input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      padding: 9px 4px;
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
      min-width: 0;
    }

    .country-input-wrap input::placeholder { color: rgba(255,255,255,0.45); }

    .picker-arrow {
      color: rgba(255,255,255,0.4);
      font-size: 0.7rem;
      flex-shrink: 0;
      transition: transform 0.2s;
      pointer-events: none;
    }

    .picker-arrow.open { transform: rotate(180deg); }

    .country-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: #1e2a45;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 999;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .country-dropdown.open { display: block; }

    .country-dropdown::-webkit-scrollbar { width: 5px; }
    .country-dropdown::-webkit-scrollbar-track { background: transparent; }
    .country-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    .dd-group-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.3);
      padding: 8px 12px 4px;
      pointer-events: none;
    }

    .dd-option {
      padding: 9px 14px;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dd-option:hover { background: rgba(255,255,255,0.08); }
    .dd-option.selected { background: rgba(233,69,96,0.2); color: #fff; }
    .dd-option.no-results {
      color: rgba(255,255,255,0.35);
      font-style: italic;
      cursor: default;
      pointer-events: none;
    }

    .decoy-badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 50px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-real    { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid #4ade8044; }
    .badge-spoofed { background: rgba(233,69,96,0.15);  color: #e94560; border: 1px solid #e9456044; }

    /* ── Link box ── */
    .link-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    #share-link {
      flex: 1;
      background: none;
      border: none;
      color: #93c5fd;
      font-size: 0.85rem;
      outline: none;
      word-break: break-all;
      cursor: text;
    }

    .copy-btn {
      background: #e94560;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .copy-btn:hover { background: #c23152; }

    .coords {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 24px;
      min-height: 18px;
      font-family: monospace;
    }

    .stop-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #f87171;
      padding: 12px 28px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s, opacity 0.2s;
    }

    .stop-btn:hover { background: rgba(248,113,113,0.15); }
    .stop-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      color: rgba(255,255,255,0.4);
    }

    .resume-btn {
      background: linear-gradient(135deg, #4ade80, #16a34a);
      border: none;
      color: #fff;
      padding: 12px 28px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 4px 16px rgba(74,222,128,0.3);
      display: none; /* hidden until stopped */
    }

    .resume-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .stopped-banner {
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.88rem;
      color: #f87171;
      margin-bottom: 16px;
      display: none;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #4ade80;
      color: #14532d;
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>

          <div class="country-dropdown" id="country-dropdown"></div>
        </div>
        <span class="decoy-badge badge-real" id="spoof-badge">REAL</span>
      </div>
    </div>

    <div class="link-box">
      <input id="share-link" type="text" readonly />
      <button class="copy-btn" onclick="copyLink()">Copy</button>
    </div>

    <div class="coords" id="coords">Waiting for GPS fix...</div>

    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">

      <button class="resume-btn" id="resume-btn" onclick="resumeSharing()">▶ Resume Sharing</button>
    </div>
  </div>

      { value: 'VN', label: '🇻🇳 Vietnam (Hanoi)',             group: '🌏 Asia' },
      { value: 'MY', label: '🇲🇾 Malaysia (Kuala Lumpur)',     group: '🌏 Asia' },
      { value: 'PK', label: '🇵🇰 Pakistan (Islamabad)',        group: '🌏 Asia' },
      { value: 'BD', label: '🇧🇩 Bangladesh (Dhaka)',          group: '🌏 Asia' },
      { value: 'LK', label: '🇱🇰 Sri Lanka (Colombo)',         group: '🌏 Asia' },
      { value: 'NP', label: '🇳🇵 Nepal (Kathmandu)',           group: '🌏 Asia' },
      { value: 'MM', label: '🇲🇲 Myanmar (Yangon)',            group: '🌏 Asia' },
      { value: 'KH', label: '🇰🇭 Cambodia (Phnom Penh)',       group: '🌏 Asia' },
      { value: 'IQ', label: '🇮🇶 Iraq (Baghdad)',              group: '🌏 Asia' },
      { value: 'IR', label: '🇮🇷 Iran (Tehran)',               group: '🌏 Asia' },
      { value: 'SA', label: '🇸🇦 Saudi Arabia (Riyadh)',       group: '🌏 Asia' },
      { value: 'AE', label: '🇦🇪 UAE (Dubai)',                 group: '🌏 Asia' },
      { value: 'TR', label: '🇹🇷 Turkey (Ankara)',             group: '🌏 Asia' },
      { value: 'IL', label: '🇮🇱 Israel (Jerusalem)',          group: '🌏 Asia' },
      { value: 'JO', label: '🇯🇴 Jordan (Amman)',              group: '🌏 Asia' },
      { value: 'KZ', label: '🇰🇿 Kazakhstan (Astana)',         group: '🌏 Asia' },
      { value: 'UZ', label: '🇺🇿 Uzbekistan (Tashkent)',       group: '🌏 Asia' },
      { value: 'AF', label: '🇦🇫 Afghanistan (Kabul)',         group: '🌏 Asia' },
      { value: 'TW', label: '🇹🇼 Taiwan (Taipei)',             group: '🌏 Asia' },
      { value: 'HK', label: '🇭🇰 Hong Kong',                  group: '🌏 Asia' },
      // Oceania
      { value: 'AU', label: '🇦🇺 Australia (Sydney)',          group: '🌏 Oceania' },
      { value: 'NZ', label: '🇳🇿 New Zealand (Auckland)',      group: '🌏 Oceania' },
      { value: 'FJ', label: '🇫🇯 Fiji (Suva)',                 group: '🌏 Oceania' },
    ];

    // ── Picker state ──
    let selectedValue = 'none';
    let selectedLabel = 'No spoof — share real location';

    const searchInput  = document.getElementById('country-search');
    const dropdown     = document.getElementById('country-dropdown');
    const pickerArrow  = document.getElementById('picker-arrow');
    const pickerTrigger = document.getElementById('picker-trigger');

    function renderDropdown(query) {
      const q = query.toLowerCase().trim();
      dropdown.innerHTML = '';
      let lastGroup = null;
      let count = 0;

      COUNTRY_LIST.forEach(item => {
        if (!item.label.toLowerCase().includes(q)) return;
        // Group header (skip for top-level "none" and when searching)
        if (item.group && item.group !== lastGroup && !q) {
          const hdr = document.createElement('div');
          hdr.className = 'dd-group-label';
          hdr.textContent = item.group;
          dropdown.appendChild(hdr);
          lastGroup = item.group;
        }
        const opt = document.createElement('div');
        opt.className = 'dd-option' + (item.value === selectedValue ? ' selected' : '');
        opt.textContent = item.label;
        opt.dataset.value = item.value;
        opt.addEventListener('mousedown', (e) => {
          e.preventDefault();
          selectCountry(item.value, item.label);
        });
        dropdown.appendChild(opt);
        count++;
      });

      if (count === 0) {
        const none = document.createElement('div');
        none.className = 'dd-option no-results';
        none.textContent = 'No countries found';
        dropdown.appendChild(none);
      }
    }

    function openDropdown() {
      renderDropdown('');
      dropdown.classList.add('open');
      pickerArrow.classList.add('open');
      searchInput.select();
    }

    function closeDropdown() {
      dropdown.classList.remove('open');
      pickerArrow.classList.remove('open');
      // Restore display label if nothing new was typed
      searchInput.value = selectedValue === 'none' ? '' : selectedLabel;
      searchInput.placeholder = selectedValue === 'none'
        ? 'No spoof — share real location'
        : selectedLabel;
    }

    function selectCountry(value, label) {
      selectedValue = value;
      selectedLabel = label;
      searchInput.value = value === 'none' ? '' : label;
      searchInput.placeholder = value === 'none' ? 'No spoof — share real location' : label;
      dropdown.classList.remove('open');
      pickerArrow.classList.remove('open');

      // Update badge
      if (value === 'none') {
        badgeEl.textContent = 'REAL';
        badgeEl.className   = 'decoy-badge badge-real';
      } else {
        badgeEl.textContent = 'SPOOFED';
        badgeEl.className   = 'decoy-badge badge-spoofed';
      }

      driftLat = 0;
      driftLng = 0;
      stopCurrentMode();
      startSharing();
    }

    pickerTrigger.addEventListener('click', () => {
      if (dropdown.classList.contains('open')) {
        closeDropdown();
      } else {
        searchInput.value = '';
        openDropdown();
      }
    });

    searchInput.addEventListener('input', () => {
      renderDropdown(searchInput.value);
      if (!dropdown.classList.contains('open')) {
        dropdown.classList.add('open');
        pickerArrow.classList.add('open');
      }
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDropdown();
    });

    // Close when clicking outside
    document.addEventListener('mousedown', (e) => {
      if (!document.getElementById('country-picker').contains(e.target)) {
        closeDropdown();
      }
    });

    // Helper used by startSharing / badge logic
    function getSelectedCountry() { return selectedValue; }

    let watchId       = null;  // GPS watch (only used in real-location mode)
    let spoofInterval = null;  // Interval timer (only used in spoof mode)
    let driftLat      = 0;
    let driftLng      = 0;

    // ── Stop whatever is currently running ──
    function stopCurrentMode() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (spoofInterval !== null) {
        clearInterval(spoofInterval);
        spoofInterval = null;
      }
    }

    // ── Spoof mode: stream decoy coordinates on an interval, no GPS needed ──
    function startSpoofMode(country) {      const anchor = DECOY_ANCHORS[country];
      statusEl.textContent = '🎭 Live — spoofed location is being shared';
      statusEl.className   = 'status-active';
      coordsEl.textContent = `Streaming from: ${anchor.lat.toFixed(4)}, ${anchor.lng.toFixed(4)}`;

      function sendSpoofed() {
        driftLat += (Math.random() - 0.5) * 0.00005;
        driftLng += (Math.random() - 0.5) * 0.00005;
        driftLat  = Math.max(-0.0005, Math.min(0.0005, driftLat));
        driftLng  = Math.max(-0.0005, Math.min(0.0005, driftLng));

        socket.emit('send-location', {
          sessionId,
          lat: anchor.lat + driftLat,
          lng: anchor.lng + driftLng,
          accuracy: 10
        });
      }

      sendSpoofed();                           // send immediately
      spoofInterval = setInterval(sendSpoofed, 4000); // then every 4 seconds
    }

    // ── Real mode: use the browser Geolocation API ──
    function startRealMode() {
      if (!navigator.geolocation) {
        statusEl.textContent = 'Geolocation is not supported by your browser.';
        statusEl.className   = 'status-error';
        return;
      }
      statusEl.textContent = 'Requesting location access...';
      statusEl.className   = '';
      coordsEl.textContent = 'Waiting for GPS fix...';

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          socket.emit('send-location', { sessionId, lat: latitude, lng: longitude, accuracy });
          statusEl.textContent = '📡 Live — real location is being shared';
          statusEl.className   = 'status-active';
          coordsEl.textContent = `Your position: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}  ±${Math.round(accuracy)}m`;
        },
        (err) => {
          statusEl.textContent = `Location error: ${err.message}`;
          statusEl.className   = 'status-error';
          coordsEl.textContent = '';
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
    }

    // ── Entry point ──
    function startSharing() {
      const country = getSelectedCountry();
      if (country !== 'none') {
        startSpoofMode(country);
      } else {
        startRealMode();
      }
    }

    function stopSharing() {
      stopCurrentMode();
      socket.emit('stop-sharing', sessionId);

      statusEl.textContent = 'You have stopped sharing.';
      statusEl.className   = '';
      coordsEl.textContent = '';
      stoppedBanner.style.display = 'block';
      stopBtn.disabled    = true;
      stopBtn.textContent = 'Sharing Stopped';
      resumeBtn.style.display = 'inline-block';
      document.querySelector('.pulse-icon').style.animation = 'none';
      document.querySelector('.pulse-icon').textContent     = '🔴';
    }

    function resumeSharing() {
      // Reset UI to active state
      stoppedBanner.style.display = 'none';
      stopBtn.disabled    = false;
      stopBtn.textContent = 'Stop Sharing';
      resumeBtn.style.display = 'none';
      document.querySelector('.pulse-icon').style.animation = 'pulse 1.5s ease-in-out infinite';
      document.querySelector('.pulse-icon').textContent     = '📡';

      // Rejoin the session room and restart streaming
      socket.emit('join-share', sessionId);
      driftLat = 0;
      driftLng = 0;
      startSharing();
    }

    function copyLink() {
      navigator.clipboard.writeText(viewerUrl).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      });
    }

    startSharing();
  </script>
