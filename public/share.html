<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharing My Location</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .pulse-icon {
      font-size: 52px;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 { font-size: 1.7rem; font-weight: 700; margin-bottom: 8px; }

    #status {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-bottom: 16px;
      min-height: 20px;
    }

    .status-active { color: #4ade80 !important; }
    .status-error  { color: #f87171 !important; }

    /* ── Decoy selector ── */
    .decoy-section {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .decoy-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .decoy-label span { font-size: 14px; }

    .decoy-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #decoy-select {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    #decoy-select option { background: #1a1a2e; color: #fff; }

    .decoy-badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 50px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-real    { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid #4ade8044; }
    .badge-spoofed { background: rgba(233,69,96,0.15);  color: #e94560; border: 1px solid #e9456044; }

    /* ── Link box ── */
    .link-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    #share-link {
      flex: 1;
      background: none;
      border: none;
      color: #93c5fd;
      font-size: 0.85rem;
      outline: none;
      word-break: break-all;
      cursor: text;
    }

    .copy-btn {
      background: #e94560;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .copy-btn:hover { background: #c23152; }

    .coords {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 24px;
      min-height: 18px;
      font-family: monospace;
    }

    .stop-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #f87171;
      padding: 12px 28px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s, opacity 0.2s;
    }

    .stop-btn:hover { background: rgba(248,113,113,0.15); }
    .stop-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      color: rgba(255,255,255,0.4);
    }

    .stopped-banner {
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.88rem;
      color: #f87171;
      margin-bottom: 16px;
      display: none;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #4ade80;
      color: #14532d;
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>

    </div>

    <div class="link-box">
      <input id="share-link" type="text" readonly />
      <button class="copy-btn" onclick="copyLink()">Copy</button>

    <div class="coords" id="coords">Waiting for GPS fix...</div>

    <div class="stopped-banner" id="stopped-banner">🔴 You have stopped sharing. Viewers have been notified.</div>

    <button class="stop-btn" id="stop-btn" onclick="stopSharing()">Stop Sharing</button>
  </div>

  <div class="toast" id="toast">Link copied!</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ── Decoy anchor coordinates (city centres) ──
    // The offset = decoy_anchor - real_anchor (computed once on first GPS fix).
    // Every subsequent update adds the same offset, so relative movement stays real.
    const DECOY_ANCHORS = {

      // Africa
      NG: { lat:  6.5244,   lng:   3.3792  }, // Lagos
      ZA: { lat: -26.2041,  lng:  28.0473  }, // Johannesburg
      EG: { lat: 30.0444,   lng:  31.2357  }, // Cairo

      SD: { lat: 15.5518,   lng:  32.5324  }, // Khartoum

      // Asia
      CN: { lat: 39.9042,   lng: 116.4074  }, // Beijing

      HK: { lat: 22.3193,   lng: 114.1694  }, // Hong Kong

      // Oceania
      AU: { lat: -33.8688,  lng: 151.2093  }, // Sydney
      NZ: { lat: -36.8485,  lng: 174.7633  }, // Auckland
      FJ: { lat: -18.1416,  lng: 178.4419  }, // Suva

    // ── Session setup ──
    const params    = new URLSearchParams(window.location.search);
    const sessionId = params.get('id');
    if (!sessionId) window.location.href = '/';

    const viewerUrl = `${window.location.origin}/view.html?id=${sessionId}`;
    document.getElementById('share-link').value = viewerUrl;

    const socket = io();
    socket.emit('join-share', sessionId);

    const statusEl  = document.getElementById('status');
    const coordsEl  = document.getElementById('coords');
    const selectEl  = document.getElementById('decoy-select');
    const badgeEl   = document.getElementById('spoof-badge');
    const stopBtn   = document.getElementById('stop-btn');
    const stoppedBanner = document.getElementById('stopped-banner');

    let watchId      = null;  // GPS watch (only used in real-location mode)
    let spoofInterval = null; // Interval timer (only used in spoof mode)

    // Small accumulated drift so the spoofed pin moves naturally (±~5m per update)
    let driftLat = 0;
    let driftLng = 0;

    // ── Stop whatever is currently running ──
    function stopCurrentMode() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (spoofInterval !== null) {
        clearInterval(spoofInterval);
        spoofInterval = null;
      }
    }

    // Update badge when user changes selection
    selectEl.addEventListener('change', () => {
      const val = selectEl.value;
      if (val === 'none') {
        badgeEl.textContent = 'REAL';
        badgeEl.className   = 'decoy-badge badge-real';
      } else {
        badgeEl.textContent = 'SPOOFED';
        badgeEl.className   = 'decoy-badge badge-spoofed';
      }
      // Reset drift and restart in the new mode
      driftLat = 0;
      driftLng = 0;
      stopCurrentMode();
      startSharing();
    });

    // ── Spoof mode: stream decoy coordinates on an interval, no GPS needed ──
    function startSpoofMode(country) {
      const anchor = DECOY_ANCHORS[country];
      statusEl.textContent = '🎭 Live — spoofed location is being shared';
      statusEl.className   = 'status-active';
      coordsEl.textContent = `Streaming from: ${anchor.lat.toFixed(4)}, ${anchor.lng.toFixed(4)}`;

      function sendSpoofed() {
        driftLat += (Math.random() - 0.5) * 0.00005;
        driftLng += (Math.random() - 0.5) * 0.00005;
        driftLat  = Math.max(-0.0005, Math.min(0.0005, driftLat));
        driftLng  = Math.max(-0.0005, Math.min(0.0005, driftLng));

        socket.emit('send-location', {
          sessionId,
          lat: anchor.lat + driftLat,
          lng: anchor.lng + driftLng,
          accuracy: 10
        });
      }

      sendSpoofed();                           // send immediately
      spoofInterval = setInterval(sendSpoofed, 4000); // then every 4 seconds
    }

    // ── Real mode: use the browser Geolocation API ──
    function startRealMode() {
      if (!navigator.geolocation) {
        statusEl.textContent = 'Geolocation is not supported by your browser.';
        statusEl.className   = 'status-error';
        return;
      }
      statusEl.textContent = 'Requesting location access...';
      statusEl.className   = '';
      coordsEl.textContent = 'Waiting for GPS fix...';

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          socket.emit('send-location', { sessionId, lat: latitude, lng: longitude, accuracy });
          statusEl.textContent = '📡 Live — real location is being shared';
          statusEl.className   = 'status-active';
          coordsEl.textContent = `Your position: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}  ±${Math.round(accuracy)}m`;
        },
        (err) => {
          statusEl.textContent = `Location error: ${err.message}`;
          statusEl.className   = 'status-error';
          coordsEl.textContent = '';
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
    }

    // ── Entry point ──
    function startSharing() {
      const country = selectEl.value;
      if (country !== 'none') {
        startSpoofMode(country);
      } else {
        startRealMode();
      }
    }

    function stopSharing() {
      stopCurrentMode();
      socket.emit('stop-sharing', sessionId);

      statusEl.textContent = 'You have stopped sharing.';
      statusEl.className   = '';
      coordsEl.textContent = '';
      stoppedBanner.style.display = 'block';
      stopBtn.disabled    = true;
      stopBtn.textContent = 'Sharing Stopped';
      document.querySelector('.pulse-icon').style.animation = 'none';
      document.querySelector('.pulse-icon').textContent     = '🔴';
    }

    function copyLink() {
      navigator.clipboard.writeText(viewerUrl).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      });
    }

    startSharing();
  </script>
</body>
</html>
