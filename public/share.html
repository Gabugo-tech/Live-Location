<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sharing your live location in real time." />
  <meta name="theme-color" content="#0f3460" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>" />
  <title>Sharing My Location</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .pulse-icon {
      font-size: 52px;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 { font-size: 1.7rem; font-weight: 700; margin-bottom: 8px; }

    #status {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-bottom: 16px;
      min-height: 20px;
    }

    .status-active { color: #4ade80 !important; }
    .status-error  { color: #f87171 !important; }

    /* ── Sign-out bar ── */
    .signout-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .signout-btn-sm {
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.4);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 20px;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .signout-btn-sm:hover { color: #f87171; border-color: rgba(248,113,113,0.4); }

    /* ── Decoy selector ── */
    .decoy-section {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .decoy-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .decoy-label span { font-size: 14px; }

    .decoy-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Searchable country picker ── */
    .country-picker {
      position: relative;
      flex: 1;
    }

    .country-input-wrap {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 0 10px;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .country-input-wrap:focus-within {
      border-color: rgba(255,255,255,0.4);
    }

    .country-input-wrap input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      padding: 9px 4px;
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
      min-width: 0;
    }

    .country-input-wrap input::placeholder { color: rgba(255,255,255,0.45); }

    .picker-arrow {
      color: rgba(255,255,255,0.4);
      font-size: 0.7rem;
      flex-shrink: 0;
      transition: transform 0.2s;
      pointer-events: none;
    }

    .picker-arrow.open { transform: rotate(180deg); }

    .country-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: #1e2a45;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 999;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .country-dropdown.open { display: block; }

    .country-dropdown::-webkit-scrollbar { width: 5px; }
    .country-dropdown::-webkit-scrollbar-track { background: transparent; }
    .country-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    .dd-group-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.3);
      padding: 8px 12px 4px;
      pointer-events: none;
    }

    .dd-option {
      padding: 9px 14px;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dd-option:hover { background: rgba(255,255,255,0.08); }
    .dd-option.selected { background: rgba(233,69,96,0.2); color: #fff; }
    .dd-option.no-results {
      color: rgba(255,255,255,0.35);
      font-style: italic;
      cursor: default;
      pointer-events: none;
    }

    .decoy-badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 50px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-real    { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid #4ade8044; }
    .badge-spoofed { background: rgba(233,69,96,0.15);  color: #e94560; border: 1px solid #e9456044; }

    /* ── Link box ── */
    .link-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    #share-link {
      flex: 1;
      background: none;
      border: none;
      color: #93c5fd;
      font-size: 0.85rem;
      outline: none;
      word-break: break-all;
      cursor: text;
    }

    .copy-btn {
      background: #e94560;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .copy-btn:hover { background: #c23152; }

    .coords {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 24px;
      min-height: 18px;
      font-family: monospace;
    }

    .stop-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #f87171;
      padding: 12px 28px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s, opacity 0.2s;
    }

    .stop-btn:hover { background: rgba(248,113,113,0.15); }
    .stop-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      color: rgba(255,255,255,0.4);
    }

    .resume-btn {
      background: linear-gradient(135deg, #4ade80, #16a34a);
      border: none;
      color: #fff;
      padding: 12px 28px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 4px 16px rgba(74,222,128,0.3);
      display: none; /* hidden until stopped */
    }

    .resume-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .stopped-banner {
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.88rem;
      color: #f87171;
      margin-bottom: 16px;
      display: none;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #4ade80;
      color: #14532d;
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <div class="pulse-icon">📡</div>
    <h1>Sharing Your Location</h1>
    <div id="status">Choose a spoof country or share your real location below.</div>

    <!-- Sign out -->
    <div class="signout-bar">
      <button class="signout-btn-sm" onclick="signOut()">Sign out</button>
    </div>

    <!-- Decoy country picker -->
    <div class="decoy-section">
      <div class="decoy-label">
        <span>🎭</span> Location Spoof — viewers will see this country instead
      </div>
      <div class="decoy-row">
        <!-- Custom searchable country picker -->
        <div class="country-picker" id="country-picker">
          <div class="country-input-wrap" id="picker-trigger">
            <input type="text" id="country-search" placeholder="No spoof — share real location" autocomplete="off" />
            <span class="picker-arrow" id="picker-arrow">▼</span>
          </div>
          <div class="country-dropdown" id="country-dropdown"></div>
        </div>
        <span class="decoy-badge badge-real" id="spoof-badge">REAL</span>
      </div>
    </div>

    <div class="link-box">
      <input id="share-link" type="text" readonly />
      <button class="copy-btn" onclick="copyLink()">Copy</button>
    </div>

    <div class="coords" id="coords">Waiting for GPS fix...</div>

    <div class="stopped-banner" id="stopped-banner">🔴 You have stopped sharing. Viewers have been notified.</div>

    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
      <button class="stop-btn" id="stop-btn" onclick="stopSharing()">Stop Sharing</button>
      <button class="resume-btn" id="resume-btn" onclick="resumeSharing()">▶ Resume Sharing</button>
    </div>
  </div>

  <div class="toast" id="toast">Link copied!</div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/share.js"></script>
</body>
</html>
